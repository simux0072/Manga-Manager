name: Verify

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manga_manager_test
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manga -d manga_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V2_TEST_DATABASE_URL: postgresql+psycopg://manga:manga@127.0.0.1:5432/manga_manager_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Validate container and deployment configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          sh -n scripts/stage-local.sh scripts/reset-local-data.sh scripts/portable-state.sh
      - run: uv run ruff check .
      - run: uv run pytest -q

  scheduler-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manga_scheduler_test
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manga -d manga_scheduler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V2_TEST_DATABASE_URL: postgresql+psycopg://manga:manga@127.0.0.1:5432/manga_scheduler_test
      V2_WORKER_CONCURRENCY: 24
      V2_NETWORK_WORKER_CONCURRENCY: 20
      V2_GLOBAL_CHAPTER_CONCURRENCY: 20
      V2_MATCH_OPERATION_CONCURRENCY: 3
      V2_PROVIDER_PACING_WINDOW_SECONDS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Check scheduler implementation
        run: >-
          uv run ruff check
          app/adapters/base.py
          app/adapters/http.py
          app/adapters/mangadex.py
          manga_manager/application/maintenance.py
          manga_manager/application/match_operations.py
          manga_manager/application/source_pull.py
          manga_manager/infrastructure/catalog_repository.py
          manga_manager/infrastructure/job_queue.py
          manga_manager/infrastructure/provider_scheduler.py
          manga_manager/worker
          manga_manager/settings.py
          tests/test_adapters.py
          tests/test_maintenance.py
          tests/test_match_operations.py
          tests/test_provider_scheduler.py
          tests/test_v2_source_pull.py
          tests/test_work_queue.py
          tests/test_worker_runtime.py
          tests/test_postgres_job_queue.py
      - name: Test shared-worker fairness and PostgreSQL races
        run: >-
          uv run pytest -q
          tests/test_work_queue.py
          tests/test_worker_runtime.py
          tests/test_download_activity.py
          tests/test_adapters.py
          tests/test_maintenance.py
          tests/test_match_operations.py
          tests/test_v2_settings_cli.py
          tests/test_v2_database.py
          tests/test_v2_source_pull.py
          tests/test_postgres_job_queue.py
          tests/test_provider_scheduler.py

  arm64-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: manga-manager:arm64-ci
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Run ARM64 migration and doctor under QEMU
        run: |
          docker run -d --name arm64-postgres --network host \
            -e POSTGRES_DB=manga_manager -e POSTGRES_USER=manga -e POSTGRES_PASSWORD=manga \
            postgres:16-alpine
          for attempt in $(seq 1 30); do
            docker exec arm64-postgres pg_isready -U manga -d manga_manager && break
            sleep 1
          done
          docker run --rm --platform linux/arm64 --network host \
            -e V2_DATABASE_URL=postgresql+psycopg://manga:manga@127.0.0.1:5432/manga_manager \
            manga-manager:arm64-ci manga-manager migrate
          docker run --rm --platform linux/arm64 --network host \
            -e V2_DATABASE_URL=postgresql+psycopg://manga:manga@127.0.0.1:5432/manga_manager \
            manga-manager:arm64-ci manga-manager doctor

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manga_manager
          POSTGRES_USER: manga
          POSTGRES_PASSWORD: manga
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U manga -d manga_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      V2_DATABASE_URL: postgresql+psycopg://manga:manga@127.0.0.1:5432/manga_manager
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run manga-manager migrate
      - name: Start web server
        run: |
          .venv/bin/uvicorn manga_manager.web.app:app --host 127.0.0.1 --port 8000 \
            > /tmp/manga-web.log 2>&1 &
          echo $! > /tmp/manga-web.pid
      - run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
      - run: npx playwright install --with-deps firefox
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - name: Stop web server
        if: always()
        run: |
          if [ -f /tmp/manga-web.pid ]; then
            kill "$(cat /tmp/manga-web.pid)" 2>/dev/null || true
          fi

  publish-arm64:
    name: Publish ARM64 image to Forgejo
    needs:
      - tests
      - scheduler-safety
      - arm64-image
      - browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on:
      - self-hosted
      - manga-builder
      - twin-tails
    permissions:
      contents: read
    env:
      REGISTRY: forgejo.twin-tails.org
      IMAGE_NAME: ninetails/manga-manager

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6

      - name: Configure ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=manga-manager-arm64
          cache-to: type=gha,mode=max,scope=manga-manager-arm64

      - name: Record immutable image reference
        run: |
          printf '%s@%s\n' \
            "${REGISTRY}/${IMAGE_NAME}" \
            '${{ steps.build.outputs.digest }}' \
            | tee image-reference.txt

          cat image-reference.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image reference
        uses: actions/upload-artifact@v6
        with:
          name: manga-manager-arm64-image-reference
          path: image-reference.txt
          retention-days: 90
